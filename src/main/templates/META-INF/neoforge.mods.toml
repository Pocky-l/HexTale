modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_url}/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="${mod_url}"
# Square icon for the mod list (NeoForge 26.2+); a wide "bannerFile" could head the info panel.
iconFile="logo.png"
description='''${mod_description}'''
# New arm poses (the Strike Gauntlet's wind-up).
enumExtensions="META-INF/enumextensions.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[31,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[26,)"
    ordering="NONE"
    side="CLIENT"

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"
