plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// Minecraft 26.x runs on Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

// Development tools that only exist in dev runs (never in the jar): the GUI screenshot driver (run guiShots).
sourceSets {
    devtools {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtoolsCompileClasspath.extendsFrom compileClasspath
    devtoolsRuntimeClasspath.extendsFrom runtimeClasspath
}

// FX lab: a separate dev-only mod (hextale_fxlab) that lays out the mod's effects and sounds in a world for review.
// Its jar goes only into the playtest client (-Pplaytest.extras=hextale_fxlab), never into a release.
sourceSets {
    fxlab {
        compileClasspath += sourceSets.main.output
    }
}
configurations {
    fxlabCompileClasspath.extendsFrom compileClasspath
}
tasks.register('fxlabJar', Jar) {
    group = 'build'
    description = 'Builds the dev-only FX lab mod jar into build/fxlab/.'
    from sourceSets.fxlab.output
    archiveBaseName = 'hextale_fxlab'
    archiveVersion = ''
    destinationDirectory = layout.buildDirectory.dir('fxlab')
}

repositories {
    maven {
        // JEI (optional integration).
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        // Curios (optional integration).
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    exclusiveContent {
        // Jade (optional integration).
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // Separate directory, so a dedicated server can run next to the dev client.
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'hextale.releasedIds', project.file('docs/released-ids.txt').absolutePath
        }

        // Opens the mod's screens by a script and saves screenshots (scripts in tools/guishots/, pictures in
        // run-guishots/screenshots/). Own game directory and world, never the owner's playtest.
        guiShots {
            client()
            sourceSet = sourceSets.devtools
            gameDirectory = project.file('run-guishots')
            programArguments.addAll '--width', '1920', '--height', '1080'
            systemProperty 'hextale.guishots', project.file('tools/guishots').absolutePath
            if (project.hasProperty('guishots.jfr')) {
                jvmArguments.add "-XX:StartFlightRecording=filename=${project.property('guishots.jfr')},settings=profile"
            }
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devtools)
        }
    }
}

// Dependencies added to localRuntime are available in dev runs but are not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional integrations, compiled against their APIs only; the playtest-26.3 client runs the mods themselves.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    def licenseName = "LICENSE_${mod_id}"
    from('LICENSE') {
        rename { licenseName }
    }
    manifest.attributes(
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors,
    )
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---------------------------------------------------------------------------
// Release
// ---------------------------------------------------------------------------

// Returns the body of the "## [version]" section of CHANGELOG.md, or null when it is missing.
static String extractChangelog(String changelog, String version) {
    def lines = changelog.readLines()
    def start = lines.findIndexOf { it ==~ /^##\s+\[?${java.util.regex.Pattern.quote(version)}\]?(\s.*)?$/ }
    if (start < 0) {
        return null
    }
    def end = lines.findIndexOf(start + 1) { it.startsWith('## ') }
    def body = lines.subList(start + 1, end < 0 ? lines.size() : end).join('\n').trim()
    return body ?: null
}

def releaseNotes = extractChangelog(
        providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.getOrElse(''),
        mod_version)
def curseforgeToken = providers.gradleProperty('curseforge_token')
        .orElse(providers.environmentVariable('CURSEFORGE_TOKEN'))

// Validates release metadata and writes the notes of the current version to build/release-notes.md.
var releaseNotesTask = tasks.register('releaseNotes') {
    group = 'publishing'
    description = 'Validates release metadata and writes notes for the current version.'

    def notes = releaseNotes
    def version = mod_version
    def projectId = curseforge_project_id
    def output = layout.buildDirectory.file('release-notes.md')
    inputs.property('notes', notes ?: '')
    inputs.property('projectId', projectId)
    outputs.file(output)

    doLast {
        if (!notes) {
            throw new GradleException("CHANGELOG.md has no non-empty section for version ${version}")
        }
        if (!(projectId ==~ /\d+/)) {
            throw new GradleException('curseforge_project_id is not set in gradle.properties')
        }
        output.get().asFile.text = notes + '\n'
    }
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    changelog = releaseNotes ?: ''
    def releaseType = providers.gradleProperty('release_type').getOrElse('release')
    type = releaseType == 'beta' ? BETA : releaseType == 'alpha' ? ALPHA : STABLE
    displayName = "${mod_name} ${mod_version}"
    modLoaders.add('neoforge')
    dryRun = providers.gradleProperty('dryRun').map { it != 'false' }.orElse(false)

    curseforge {
        projectId = curseforge_project_id
        accessToken = curseforgeToken
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_25)
        client = curseforge_client.toBoolean()
        server = curseforge_server.toBoolean()
        curseforge_requires.split(',')*.trim().findAll().each { requires(it) }
        curseforge_optional.split(',')*.trim().findAll().each { optional(it) }
    }
}

tasks.named('publishCurseforge') {
    dependsOn releaseNotesTask
}
